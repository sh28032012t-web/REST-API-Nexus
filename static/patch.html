<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PATCH // REST.NEXUS</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body class="patch-page">
<header class="topbar">
    <a class="logo" href="/">
        <span>◈</span>
        REST<span class="muted">.NEXUS</span>
    </a>

    <nav>
        <a class="nav-btn get" href="/get.html">GET</a>
        <a class="nav-btn post" href="/post.html">POST</a>
        <a class="nav-btn put" href="/put.html">PUT</a>
        <a class="nav-btn patch active" href="/patch.html">PATCH</a>
        <a class="nav-btn delete" href="/delete.html">DELETE</a>
    </nav>
</header>

<main class="panel">
    <a class="back" href="/">← На главную</a>

    <div class="eyebrow">04 // PARTIAL UPDATE</div>

    <h1 class="gradient-title purple">
        Частично изменить пользователя
    </h1>

    <p class="subtitle">
        Укажи ID и заполни только те поля, которые хочешь изменить.
        Пустые поля не отправляются в PATCH-запросе.
    </p>

    <section class="console form-grid">
        <label>
            ID пользователя
            <input
                id="patchId"
                type="number"
                min="1"
                placeholder="Введите ID"
                value="1"
            >
        </label>

        <label>
            Имя
            <input
                id="patchFirstName"
                type="text"
                maxlength="64"
                placeholder="Оставь пустым, если не меняешь"
            >
        </label>

        <label>
            Фамилия
            <input
                id="patchLastName"
                type="text"
                maxlength="64"
                placeholder="Оставь пустым, если не меняешь"
            >
        </label>

        <label>
            Возраст
            <input
                id="patchAge"
                type="number"
                min="0"
                max="150"
                placeholder="Оставь пустым, если не меняешь"
            >
        </label>

        <button class="action purple" onclick="patchUser()">
            Отправить PATCH запрос
            <span>→</span>
        </button>

        <div class="response-head">
            RESPONSE
            <span id="patchStatus"></span>
        </div>

        <pre id="patchOutput">Здесь появится ответ сервера...</pre>
    </section>
</main>

<script src="/static/script.js"></script>
</body>
</html>
